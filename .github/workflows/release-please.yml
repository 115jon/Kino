name: Release Please

on:
  push:
    branches:
      - desktop
  workflow_dispatch:

permissions:
  contents: write
  issues: write
  pull-requests: write

jobs:
  release-please:
    runs-on: ubuntu-latest
    steps:
      - name: Preserve trusted release tools
        env:
          GH_TOKEN: ${{ secrets.RELEASE_TOKEN }}
        run: |
          mkdir -p "$RUNNER_TEMP/kino-release-tools"
          gh api "repos/$GITHUB_REPOSITORY/contents/scripts/versioning.mjs?ref=desktop" --jq .content | tr -d '\n' | base64 --decode > "$RUNNER_TEMP/kino-release-tools/versioning.mjs"
          gh api "repos/$GITHUB_REPOSITORY/contents/scripts/sync-release-version.mjs?ref=desktop" --jq .content | tr -d '\n' | base64 --decode > "$RUNNER_TEMP/kino-release-tools/sync-release-version.mjs"

      - name: Require release token
        env:
          RELEASE_TOKEN: ${{ secrets.RELEASE_TOKEN }}
        run: |
          if [ -z "$RELEASE_TOKEN" ]; then
            echo "RELEASE_TOKEN is required so release tags and PR checks trigger normally."
            exit 1
          fi

      - name: Run Release Please
        id: release
        uses: googleapis/release-please-action@5c625bfb5d1ff62eadeeb3772007f7f66fdcf071
        with:
          token: ${{ secrets.RELEASE_TOKEN }}
          target-branch: desktop
          config-file: .github/release-please/desktop-config.json
          manifest-file: .github/release-please/desktop-manifest.json

      - name: Read release PR branch
        id: release-pr
        env:
          GH_TOKEN: ${{ secrets.RELEASE_TOKEN }}
        run: |
          branch=$(gh pr list --repo "$GITHUB_REPOSITORY" --base desktop --head release-please--branches--desktop--components--desktop --state open --json headRefName --jq '.[0].headRefName')
          if [ -n "$branch" ]; then
            echo "branch=$branch" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up Node
        if: steps.release-pr.outputs.branch != ''
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Check out the release PR branch
        if: steps.release-pr.outputs.branch != ''
        env:
          RELEASE_BRANCH: ${{ steps.release-pr.outputs.branch }}
          RELEASE_TOKEN: ${{ secrets.RELEASE_TOKEN }}
        run: |
          git init
          git remote add origin "https://x-access-token:$RELEASE_TOKEN@github.com/$GITHUB_REPOSITORY.git"
          git fetch --no-tags origin "refs/heads/$RELEASE_BRANCH:refs/remotes/origin/$RELEASE_BRANCH" "refs/heads/desktop:refs/remotes/origin/desktop"
          git checkout -B "$RELEASE_BRANCH" "origin/$RELEASE_BRANCH"

      - name: Synchronize desktop version code
        if: steps.release-pr.outputs.branch != ''
        run: node "$RUNNER_TEMP/kino-release-tools/sync-release-version.mjs" --platform=desktop --base-ref=origin/desktop

      - name: Push synchronized version code
        if: steps.release-pr.outputs.branch != ''
        env:
          RELEASE_BRANCH: ${{ steps.release-pr.outputs.branch }}
          RELEASE_TOKEN: ${{ secrets.RELEASE_TOKEN }}
        run: |
          if git diff --quiet -- release/versions/desktop.properties; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add release/versions/desktop.properties
          git commit -m "chore(release): sync desktop version code"
          git -c http.extraheader="AUTHORIZATION: bearer $RELEASE_TOKEN" push origin "HEAD:$RELEASE_BRANCH"
