name: Desktop Release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Platform release tag to build
        required: true
        type: string
  push:
    tags:
      - 'desktop-v*'

permissions:
  contents: write

jobs:
  windows-installer:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ inputs.tag || github.ref }}

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Validate release tag
        shell: pwsh
        env:
          RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          if (-not $env:RELEASE_TAG.StartsWith("desktop-v")) {
            throw "Desktop releases must run from a desktop-v* tag."
          }

      - name: Configure runtime properties
        shell: pwsh
        env:
          NUVIO_SUPABASE_URL: ${{ secrets.KINO_SUPABASE_URL }}
          NUVIO_SUPABASE_ANON_KEY: ${{ secrets.KINO_SUPABASE_ANON_KEY }}
          INTRODB_API_URL: ${{ secrets.KINO_INTRODB_API_URL }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:NUVIO_SUPABASE_URL)) {
            throw "KINO_SUPABASE_URL is not configured."
          }
          if ([string]::IsNullOrWhiteSpace($env:NUVIO_SUPABASE_ANON_KEY)) {
            throw "KINO_SUPABASE_ANON_KEY is not configured."
          }
          @"
          NUVIO_SUPABASE_URL=$env:NUVIO_SUPABASE_URL
          NUVIO_SUPABASE_ANON_KEY=$env:NUVIO_SUPABASE_ANON_KEY
          INTRODB_API_URL=$env:INTRODB_API_URL
           "@ | Set-Content -Path local.properties -Encoding ascii

      - name: Validate Windows desktop compilation and tests
        shell: pwsh
        run: .\gradlew.bat --no-daemon '-Pkino.release.platform=desktop' :composeApp:compileKotlinDesktop :composeApp:desktopTest

      - name: Build installer
        shell: pwsh
        run: powershell -ExecutionPolicy Bypass -File .\desktop\scripts\build-installer.ps1

      - name: Prepare release assets
        shell: pwsh
        env:
          RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          $version = $env:RELEASE_TAG.Substring("desktop-v".Length)
          $installer = Get-ChildItem -LiteralPath ".\desktop\installer\bin\Release" -Filter "KinoSetup-*.exe" -File |
            Sort-Object LastWriteTime -Descending |
            Select-Object -First 1
          if ($null -eq $installer) { throw "No desktop installer was produced." }
          New-Item -ItemType Directory -Path ".\release-assets" -Force | Out-Null
          $assetPath = ".\release-assets\Kino-Desktop-$version.exe"
          Copy-Item -LiteralPath $installer.FullName -Destination $assetPath -Force
          $versionCode = (Get-Content -LiteralPath ".\release\versions\desktop.properties" | Where-Object { $_ -match '^versionCode=' } | Select-Object -First 1).Split('=')[1]
          node .\scripts\release-manifest.mjs `
            "--platform=desktop" `
            "--version=$version" `
            "--version-code=$versionCode" `
            "--asset=$assetPath" `
            "--output=release-assets/release-manifest.json"
          node .\scripts\verify-release-state.mjs "--platform=desktop" "--tag=$env:RELEASE_TAG"

      - name: Publish installer
        uses: softprops/action-gh-release@v2
        with:
          files: release-assets/*
          name: Kino Desktop ${{ inputs.tag || github.ref_name }}
          generate_release_notes: true
