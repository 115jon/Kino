name: Android Release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Platform release tag to build
        required: true
        type: string
  push:
    tags:
      - 'android-v*'

permissions:
  contents: write

jobs:
  android-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ inputs.tag || github.ref }}

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Validate release tag
        shell: bash
        env:
          RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          if [[ "$RELEASE_TAG" != android-v* ]]; then
            echo "Android releases must run from an android-v* tag."
            exit 1
          fi

      - name: Decode signing keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KINO_RELEASE_KEYSTORE_BASE64 }}
        run: printf '%s' "$KEYSTORE_BASE64" | base64 --decode > kino-release.keystore

      - name: Configure runtime and signing properties
        env:
          NUVIO_SUPABASE_URL: ${{ secrets.KINO_SUPABASE_URL }}
          NUVIO_SUPABASE_ANON_KEY: ${{ secrets.KINO_SUPABASE_ANON_KEY }}
          INTRODB_API_URL: ${{ secrets.KINO_INTRODB_API_URL }}
          STORE_PASSWORD: ${{ secrets.KINO_RELEASE_STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KINO_RELEASE_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KINO_RELEASE_KEY_PASSWORD }}
        run: |
          cat > local.properties <<EOF
          NUVIO_SUPABASE_URL=$NUVIO_SUPABASE_URL
          NUVIO_SUPABASE_ANON_KEY=$NUVIO_SUPABASE_ANON_KEY
          INTRODB_API_URL=$INTRODB_API_URL
          KINO_APPLICATION_ID=site.x115jon.kino
          NUVIO_RELEASE_STORE_FILE=$GITHUB_WORKSPACE/kino-release.keystore
          NUVIO_RELEASE_STORE_PASSWORD=$STORE_PASSWORD
          NUVIO_RELEASE_KEY_ALIAS=$KEY_ALIAS
          NUVIO_RELEASE_KEY_PASSWORD=$KEY_PASSWORD
          EOF

      - name: Build full release APK
        run: ./gradlew --no-daemon -Pkino.release.platform=android :androidApp:assembleFullRelease

      - name: Prepare release assets
        shell: bash
        env:
          RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          set -euo pipefail
          version="${RELEASE_TAG#android-v}"
          apk_path="$(find androidApp/build/outputs/apk/full/release -type f -name '*.apk' -print -quit)"
          if [[ -z "$apk_path" ]]; then
            echo "No Android release APK was produced."
            exit 1
          fi
          mkdir -p release-assets
          asset_path="release-assets/Kino-Android-${version}.apk"
          cp "$apk_path" "$asset_path"
          version_code="$(awk -F= '$1 == "versionCode" {print $2}' release/versions/android.properties)"
          node scripts/release-manifest.mjs \
            --platform=android \
            --version="$version" \
            --version-code="$version_code" \
            --asset="$asset_path" \
            --output=release-assets/release-manifest.json
          node scripts/verify-release-state.mjs --platform=android --tag="$RELEASE_TAG"

      - name: Publish APK
        uses: softprops/action-gh-release@v2
        with:
          files: release-assets/*
          name: Kino Android ${{ inputs.tag || github.ref_name }}
          generate_release_notes: true
